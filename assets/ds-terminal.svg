<svg xmlns="http://w3.org" viewBox="0 0 760 330" width="760" height="330">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12; }
    .header { fill: #161b22; }
    .title { fill: #8b949e; font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 13px; }
    .prompt { fill: #38bdf8; font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 14px; font-weight: bold; }
    .cmd { fill: #f0f6fc; font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 14px; }
    .out { fill: #8b949e; font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 13.5px; }
    .accent { fill: #3fb950; font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 13.5px; font-weight: bold; }
    .highlight { fill: #d2a8ff; font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 13.5px; }
    
    /* Typing & Reveal Animations */
    .line1 { opacity: 0; animation: fadeIn 0.3s ease forwards 0.4s; }
    .line2 { opacity: 0; animation: fadeIn 0.3s ease forwards 1.4s; }
    .line3 { opacity: 0; animation: fadeIn 0.3s ease forwards 2.4s; }
    .line4 { opacity: 0; animation: fadeIn 0.3s ease forwards 3.4s; }
    .line5 { opacity: 0; animation: fadeIn 0.3s ease forwards 4.5s; }
    .line6 { opacity: 0; animation: fadeIn 0.3s ease forwards 5.6s; }
    .line7 { opacity: 0; animation: fadeIn 0.3s ease forwards 6.6s; }
    .cursor { animation: blink 1s step-end infinite; fill: #38bdf8; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Window Frame -->
  <rect class="bg" x="1" y="1" width="758" height="328" rx="12" />
  <path class="header" d="M 1 13 Q 1 1 13 1 L 747 1 Q 759 1 759 13 L 759 38 L 1 38 Z" />
  
  <!-- macOS Window Buttons -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56" />
  <circle cx="42" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="20" r="6" fill="#27c93f" />
  <text class="title" x="380" y="24" text-anchor="middle">soroel@ds-studio: ~/ai-strategy</text>

  <!-- Terminal Content -->
  <g class="line1">
    <text x="24" y="70"><tspan class="prompt">soroel@ai-lab:~$</tspan> <tspan class="cmd">python3 explore_profile.py --role="Data Scientist"</tspan></text>
  </g>

  <g class="line2">
    <text class="out" x="24" y="100">[INFO] Loading core modules: <tspan class="highlight">pandas, scikit-learn, pytorch, sql</tspan></text>
  </g>

  <g class="line3">
    <text class="out" x="24" y="128">[DATA] Transforming raw datasets ──▶ <tspan class="accent">Actionable Strategic Insights ✔</tspan></text>
  </g>

  <g class="line4">
    <text x="24" y="164"><tspan class="prompt">soroel@ai-lab:~$</tspan> <tspan class="cmd">cat focus_areas.json</tspan></text>
  </g>

  <g class="line5">
    <text class="out" x="24" y="192">{ "engineering": <tspan class="highlight">"Scalable ML Pipelines"</tspan>, "strategy": <tspan class="highlight">"High-Impact AI"</tspan> }</text>
  </g>

  <g class="line6">
    <text x="24" y="228"><tspan class="prompt">soroel@ai-lab:~$</tspan> <tspan class="cmd">./deploy_innovation.sh --production</tspan></text>
  </g>

  <g class="line7">
    <text class="accent" x="24" y="256">Model deployed! Bridging engineering, data science &amp; real-world impact.</text>
    <text x="24" y="292"><tspan class="prompt">soroel@ai-lab:~$</tspan> </text>
    <rect class="cursor" x="168" y="279" width="9" height="16" />
  </g>
</svg>
